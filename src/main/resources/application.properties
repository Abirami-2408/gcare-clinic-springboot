server.port=${PORT:8080}

# MySQL connection (the password has NO default on purpose)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/gcare?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Never change existing tables automatically
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

spring.thymeleaf.cache=false

# Image uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload-dir=${UPLOAD_DIR:uploads}

# First admin account, created once at startup by AdminSeeder
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.password=${ADMIN_PASSWORD:}